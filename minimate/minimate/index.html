<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0D12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MiniMate">
<title>MiniMate</title>
<style>
:root{--bg:#0B0D12;--bg2:#12151D;--card:#181C26;--ac:#8B7CFF;--ac2:#48D6C5;--tx:#F5F6FA;--tx2:#9299AA;--bd:#262b38}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Roboto,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--bd)}
header b{font-size:18px}header .s{color:var(--tx2);font-size:12px}
#pet{width:64px;height:64px;flex:0 0 64px;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-4px)}}
.eye{animation:blink 4s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.talk #mouth{animation:talk .3s infinite alternate}
@keyframes talk{to{transform:scaleY(2.2)}}#mouth{transform-origin:center;transform-box:fill-box}
.grow{flex:1}
button,input,select{font:inherit;color:var(--tx)}
button{background:var(--ac);border:0;border-radius:12px;padding:0 16px;min-height:44px;font-weight:600;color:#fff}
button.g{background:transparent;border:1px solid var(--bd);color:var(--tx2);min-height:40px;padding:0 12px}
input,select{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:0 12px;min-height:44px;width:100%}
#log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:85%;padding:9px 13px;border-radius:16px;background:var(--card);border:1px solid var(--bd);white-space:pre-wrap;word-break:break-word}
.m.u{align-self:flex-end;background:var(--ac);border-color:var(--ac)}
.m.h{color:var(--tx2);font-size:14px}
form{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--bd)}
#set{display:none;padding:12px 14px;border-bottom:1px solid var(--bd);background:var(--bg2)}
#set.on{display:block}#set label{display:block;margin:8px 0 4px;color:var(--tx2);font-size:13px}
#set .r{display:flex;gap:8px;align-items:center;margin-top:10px}#set .r input{width:auto;min-height:auto}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header>
 <svg id="pet" viewBox="0 0 64 64" aria-hidden="true">
  <path d="M10 30C0 22 2 12 8 10C10 18 16 22 20 26Z" fill="#c9bfff"/><path d="M54 30C64 22 62 12 56 10C54 18 48 22 44 26Z" fill="#c9bfff"/>
  <circle cx="18" cy="14" r="8" fill="#ff9d4d"/><circle cx="46" cy="14" r="8" fill="#ff9d4d"/>
  <circle cx="18" cy="14" r="4" fill="#ffc9a0"/><circle cx="46" cy="14" r="4" fill="#ffc9a0"/>
  <ellipse cx="32" cy="38" rx="22" ry="20" fill="#ff9d4d"/>
  <ellipse class="eye" cx="24" cy="34" rx="3" ry="4" fill="#12151D"/><ellipse class="eye" cx="40" cy="34" rx="3" ry="4" fill="#12151D"/>
  <ellipse cx="32" cy="41" rx="3" ry="2" fill="#12151D"/>
  <ellipse id="mouth" cx="32" cy="47" rx="4" ry="1.5" fill="#12151D"/>
  <circle cx="17" cy="42" r="3" fill="#ff7a8a" opacity=".5"/><circle cx="47" cy="42" r="3" fill="#ff7a8a" opacity=".5"/>
 </svg>
 <div class="grow"><b id="nm">MiniMate</b><div class="s" id="st"></div></div>
 <button class="g" onclick="$('#set').classList.toggle('on')">Ayarlar</button>
</header>
<div id="set">
 <label>MiniMate'in adı</label><input id="sn" autocomplete="off">
 <div class="r"><input type="checkbox" id="sw"><span>Sadece adım söylenince cevap ver (ör. "Mino merhaba")</span></div>
 <div class="r"><input type="checkbox" id="ss"><span>Sesli konuş</span></div>
 <label>Gemini API anahtarın (yalnızca bu cihazda saklanır)</label><input id="sk" type="password" autocomplete="off">
 <label>Model</label><input id="sm" autocomplete="off">
 <div class="r"><button onclick="saveCfg()">Kaydet</button><button class="g" onclick="clearChat()">Sohbeti sil</button></div>
</div>
<div id="log" aria-live="polite"></div>
<form id="f"><input id="in" placeholder="Bir şey yaz…" autocomplete="off"><button>Gönder</button></form>
<script>
const KEY='minimate.v1',$=s=>document.querySelector(s);
const DEF={name:'Mino',wake:true,speak:true,key:'',model:'gemini-2.0-flash',hist:[]};
let M;try{M=Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){M={...DEF}}
let saveFail=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(M))}catch(e){if(!saveFail){saveFail=true;add('Kaydedilemedi: depolama dolu veya kapalı.','h')}}}
const tr=s=>s.toLocaleLowerCase('tr-TR');
function add(t,c){const d=document.createElement('div');d.className='m '+c;d.textContent=t;const l=$('#log');l.appendChild(d);l.scrollTop=l.scrollHeight;return d}
function head(){$('#nm').textContent=M.name;$('#st').textContent=M.wake?`"${M.name} ..." diye seslen`:'Her mesaja cevap veriyor'}
function loadCfg(){$('#sn').value=M.name;$('#sw').checked=M.wake;$('#ss').checked=M.speak;$('#sk').value=M.key;$('#sm').value=M.model}
function saveCfg(){M.name=$('#sn').value.trim()||'Mino';M.wake=$('#sw').checked;M.speak=$('#ss').checked;M.key=$('#sk').value.trim();M.model=$('#sm').value.trim()||DEF.model;save();head();$('#set').classList.remove('on');add('Ayarlar kaydedildi.','h')}
function clearChat(){if(confirm('Sohbet geçmişi silinsin mi?')){M.hist=[];save();$('#log').innerHTML=''}}
function say(t){if(!M.speak||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';u.onstart=()=>document.body.classList.add('talk');u.onend=u.onerror=()=>document.body.classList.remove('talk');speechSynthesis.speak(u)}catch(e){}}
async function ask(text){
 const ctrl=new AbortController(),to=setTimeout(()=>ctrl.abort(),25000);
 const contents=[...M.hist.slice(-12),{role:'user',parts:[{text}]}];
 const body={systemInstruction:{parts:[{text:`Sen ${M.name}, sevimli ve şakacı bir masaüstü arkadaşısın. Türkçe, sıcak ve kısa (en fazla 3 cümle) konuş. Bilmediğin şeyi uydurma.`}]},contents};
 try{
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(M.model)}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':M.key},body:JSON.stringify(body),signal:ctrl.signal});
  if(!r.ok){const c=r.status;return {err:c==400||c==403?'API anahtarı geçersiz görünüyor. Ayarlardan kontrol et.':c==404?'Model bulunamadı. Ayarlardan model adını değiştir.':c==429?'İstek limiti doldu, biraz bekle.':'Gemini hata verdi ('+c+').'}}
  const j=await r.json(),t=j.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('').trim();
  if(!t)return {err:'Cevap boş geldi (filtreye takılmış olabilir). Başka türlü sor.'};
  M.hist.push({role:'user',parts:[{text}]},{role:'model',parts:[{text:t}]});M.hist=M.hist.slice(-40);save();return {t};
 }catch(e){return {err:e.name=='AbortError'?'Zaman aşımı. İnterneti kontrol et.':'Bağlantı kurulamadı. İnternet var mı?'}}
 finally{clearTimeout(to)}
}
$('#f').addEventListener('submit',async e=>{
 e.preventDefault();const inp=$('#in'),text=inp.value.trim();if(!text)return;inp.value='';add(text,'u');
 let msg=text;
 if(M.wake){
  const a=tr(text),n=tr(M.name);
  if(!a.startsWith(n)){add(`Adımla başla: "${M.name} ${text}". (Ayarlardan bu özelliği kapatabilirsin.)`,'h');return}
  msg=text.slice(M.name.length).replace(/^[\s,:;!.\-]+/,'');
  if(!msg){const t='Buyur, dinliyorum!';add(t,'m');say(t);return}
 }
 if(!M.key){add('Önce Ayarlar bölümüne Gemini API anahtarını gir.','h');return}
 const w=add('…','m'),r=await ask(msg);
 if(r.err){w.textContent=r.err;w.className='m h'}else{w.textContent=r.t;say(r.t)}
});
M.hist.forEach(h=>add(h.parts[0].text,h.role=='user'?'u':'m'));
loadCfg();head();
if(!M.hist.length)add(M.key?`Merhaba! "${M.name} merhaba" yazarak bana seslenebilirsin.`:'Merhaba! Önce Ayarlar bölümüne Gemini API anahtarını gir.','h');
</script>
</body>
</html>
